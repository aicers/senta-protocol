# release-plz opens a release pull request for every change that touches
# the package and, once that pull request is merged, tags the merge and
# creates the GitHub Release. See .github/workflows/release-plz.yml.
#
# Until `main` has a root Cargo.toml there is no package, and the release
# workflow skips both release-plz commands.

[workspace]
# Nothing is published to a registry, so the last release is the latest
# `X.Y.Z` tag, not a crates.io version.
git_only = true
# No `cargo publish`, whatever the package's Cargo.toml says. The tag and
# the GitHub Release are made all the same.
publish = false
# Release only when a release pull request has just been merged.
release_always = false
# Below 1.0.0, a breaking change (`!`) raises the minor and every other
# change, `feat` included, raises the patch. From 1.0.0 on, SemVer. This
# is release-plz's default, spelled out so it is not changed by accident.
# In 0.0.x, release-plz 0.4.3 raises the patch for a breaking change
# too (0.0.1 -> 0.0.2), so the minor rule holds from 0.1.0 on. That is
# the accepted rule: under SemVer every 0.0.x release may break anyway,
# so nothing is lost, and nothing is configured or checked for it. The
# coordinator accepted it in DECISION 7075668518
# (`https://github.com/aicers/taco/issues/173#issuecomment-7075668518`).
features_always_increment_minor = false
# Plain `X.Y.Z` tags, never `v`-prefixed.
git_tag_name = "{{ version }}"
git_release_name = "{{ package }} {{ version }}"
pr_name = "chore: release {{ version }}"

[changelog]
# The current head of CHANGELOG.md, so a generated section leaves the
# file's opening as it is.
header = """# Changelog

This file documents recent notable changes to this project. The format of this
file is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/), and
this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

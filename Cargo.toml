[package]
name = "senta-protocol"
version = "0.1.0"
edition = "2024"
description = "Protocol, record formats and trust contracts shared by Clumit Endpoint, REview and the event store"
license = "Apache-2.0"
repository = "https://github.com/aicers/senta-protocol"

# No feature is on by default: each consumer turns on only the parts it
# uses. Any combination of the four is supported.
[features]
default = []
auth = [
  "dep:base64",
  "dep:ed25519-dalek",
  "dep:rcgen",
  "dep:rustls",
  "dep:rustls-webpki",
  "dep:semver",
  "dep:serde_json",
  "dep:sha2",
  "dep:thiserror",
  "dep:time",
  "dep:url",
]
control = []
telemetry = []
test-util = []

[dependencies]
base64 = { version = "0.23", optional = true, default-features = false, features = ["std"] }
# Verifies JWS signatures, signs the endpoint's self-signed certificate
# and encodes its key as PKCS#8.
ed25519-dalek = { version = "3", optional = true, features = ["alloc", "pkcs8"] }
# The timestamp every module of this crate takes.
jiff = { version = "1", default-features = false, features = ["std"] }
# Builds the endpoint's self-signed certificate. Its default features
# pull in `ring`; the signing is done by `ed25519-dalek` instead.
rcgen = { version = "0.14", optional = true, default-features = false }
# TLS configuration and certificate verification. No crypto provider
# feature: the caller passes the provider in.
rustls = { version = "0.23.41", optional = true, default-features = false, features = ["std"] }
# The certificate parser `rustls` itself uses, so the SPKI hashed is the
# one whose key verified the handshake signature.
rustls-webpki = { version = "0.103.14", optional = true, default-features = false, features = ["std"] }
# The `SemVer` target version of a signed update document, compared by
# SemVer precedence.
semver = { version = "1.0.28", optional = true, default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
# SHA-256 of JWS payloads and of the SubjectPublicKeyInfo.
sha2 = { version = "0.11", optional = true }
# Typed errors a caller matches on.
thiserror = { version = "2", optional = true }
# The validity time type `rcgen` takes.
time = { version = "0.3", optional = true, default-features = false }
# The absolute URLs signed documents carry, parsed by the WHATWG rules.
url = { version = "2.5.9", optional = true, default-features = false, features = ["std"] }
uuid = "1"

[dev-dependencies]
# Encodes and decodes the CBOR the tests check.
ciborium = "0.2"
# Ed25519 key pairs the tests sign with.
ed25519-dalek = { version = "3", features = ["alloc", "pkcs8"] }
# Certificates for the test CAs, servers and non-Ed25519 clients.
rcgen = { version = "0.14", features = ["aws_lc_rs", "pem"] }
# The crypto provider the tests pass in, and TLS 1.2 peers to reject.
rustls = { version = "0.23.41", features = ["aws_lc_rs", "tls12"] }
# Reads the generated certificate back independently.
x509-parser = "0.18"
